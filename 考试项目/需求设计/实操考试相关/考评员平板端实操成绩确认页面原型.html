<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考评员平板端 - 实操成绩确认</title>
  <link rel="icon" href="data:," />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#172a35;--muted:#657983;--line:#d8e1e4;--paper:#fff;--wash:#eef3f3;--nav:#12343a;--teal:#17766f;--teal-soft:#e4f3ef;--amber:#9a5a13;--amber-soft:#fff1d8;--red:#a23e3a;--red-soft:#fdecea;--blue:#256a8a;--shadow:0 16px 42px rgba(22,48,56,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--wash);color:var(--ink);font:14px "Noto Sans SC",sans-serif;letter-spacing:0}.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr}.topbar{background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 4px 16px rgba(10,30,34,.16)}.brand,.examiner{display:flex;align-items:center;gap:11px}.brand-mark{width:34px;height:34px;border-radius:6px;background:#d8ad4b;color:#21353a;display:grid;place-items:center}.brand b{font-family:"Noto Serif SC",serif;font-size:17px}.brand small{display:block;color:#a9c2c5;font-size:11px;margin-top:2px}.examiner{color:#dbe8e8}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f0d99d;color:#254047;font-weight:700}.workspace{width:min(1280px,100%);margin:0 auto;padding:18px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;min-height:0}.task-pane,.detail-pane{background:var(--paper);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);min-height:0}.task-pane{display:flex;flex-direction:column;overflow:hidden}.pane-head{padding:16px;border-bottom:1px solid var(--line)}.pane-head h1{font:700 20px "Noto Serif SC",serif;margin:0 0 4px}.pane-head p{margin:0;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.stat{padding:12px 8px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:11px}.filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}button{font:inherit;letter-spacing:0}.filter,.secondary,.primary,.icon-button{border:1px solid transparent;border-radius:5px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.filter{padding:0 11px;background:#f4f7f7;color:var(--muted)}.filter.active{color:var(--teal);background:var(--teal-soft);border-color:#b8ddd5}.primary{padding:0 16px;background:var(--teal);color:#fff;font-weight:700}.secondary{padding:0 13px;background:#fff;color:var(--ink);border-color:#bdcbcf}.icon-button{width:36px;background:#fff;color:var(--muted);border-color:var(--line)}button svg{width:16px;height:16px}.task-list{overflow:auto;padding:8px}.task{width:100%;border:1px solid transparent;background:#fff;padding:12px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:7px 10px;cursor:pointer;border-radius:5px;margin-bottom:6px}.task:hover{background:#f5f8f8}.task.active{border-color:#8fc9bf;background:#edf8f5}.task strong{font-size:15px}.task .project{grid-column:1/-1;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:18px;font-weight:700;color:var(--blue)}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;width:max-content}.tag.pending{color:var(--amber);background:var(--amber-soft)}.tag.confirmed{color:var(--teal);background:var(--teal-soft)}.detail-pane{overflow:auto}.detail-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:2}.detail-head h2{margin:0;font-size:17px}.detail-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.detail-body{padding:18px}.source-band{display:grid;grid-template-columns:1.1fr 1.5fr .8fr .8fr;gap:12px;background:#f5f8f8;border:1px solid var(--line);padding:13px 15px;border-radius:5px}.source-band span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.source-band b{font-size:13px}.section-title{margin:20px 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.section-title:before{content:"";width:4px;height:17px;background:#d6a63e;border-radius:2px}.score-form{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #bdcbd0;border-radius:5px;background:#fff;padding:0 10px;font:inherit;color:var(--ink)}.field input{height:40px}.field textarea{min-height:72px;padding-top:9px;resize:vertical}.field input[readonly]{background:#edf2f2;color:#42545b}.field.full{grid-column:1/-1}.required:after{content:" *";color:var(--red)}.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px}.segment label{position:relative;margin:0}.segment input{position:absolute;opacity:0}.segment span{min-height:42px;border:1px solid #c4d1d4;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:600}.segment input:checked+span{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}.hidden{display:none!important}.signature-box{border:1px solid #aebfc4;border-radius:5px;overflow:hidden;background:#fff}.signature-box canvas{display:block;width:100%;height:150px;background:linear-gradient(#fff,#fbfcfc);touch-action:none;cursor:crosshair}.signature-foot{min-height:42px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.signature-state.signed{color:var(--teal);font-weight:600}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.history{border:1px solid var(--line);border-radius:5px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:#f2f6f6;color:#52666e;font-size:11px;text-align:left;padding:9px 10px}td{padding:10px;border-top:1px solid #e5ebed;font-size:12px}.empty{padding:24px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#18343a;color:#fff;padding:11px 16px;border-radius:5px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:var(--red)}
    @media(max-width:820px){.workspace{grid-template-columns:300px minmax(0,1fr);padding:10px;gap:10px}.source-band{grid-template-columns:1fr 1fr}.score-form{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{padding:0 14px}}
    @media(max-width:650px){.workspace{grid-template-columns:1fr}.task-pane{max-height:330px}.examiner span{display:none}.source-band{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"><i data-lucide="clipboard-check"></i></div><div><b>实操考评工作台</b><small>考评员平板端</small></div></div>
      <div class="examiner"><i data-lucide="wifi"></i><span>考评员 张伟 · 高新实操考点</span><div class="avatar">张</div></div>
    </header>
    <main class="workspace">
      <aside class="task-pane">
        <div class="pane-head"><h1>成绩确认</h1><p>设备原始成绩只读，签名后形成最终成绩</p></div>
        <div class="stats" id="stats"></div>
        <div class="filters"><button class="filter active" data-filter="pending">待确认</button><button class="filter" data-filter="all">全部</button><button class="filter" data-filter="confirmed">已确认</button></div>
        <div class="task-list" id="taskList"></div>
      </aside>
      <section class="detail-pane" id="detailPane"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    (function(global){
      'use strict';
      function rawScore(data){return Object.freeze({...data,immutable:true});}
      const scoreRecords=[
        {questionInstanceId:'PQI-HV-20260728-001-K2-01',candidate:'张三',idCard:'3601**********1023',project:'高压开关柜停送电操作',category:'K2 安全操作技术',source:'泰豪实训平台',raw:rawScore({rawScoreReference:'DEVICE:taihao:TS-20260728-001',rawScore:86.5,maxScore:100,completedAt:'2026-07-28T09:30:00+08:00'}),status:'PENDING_CONFIRMATION',confirmationVersions:[]},
        {questionInstanceId:'PQI-HV-20260728-002-K2-01',candidate:'李四',idCard:'3601**********2048',project:'高压断路器分合闸操作',category:'K2 安全操作技术',source:'实训设备平台 B',raw:rawScore({rawScoreReference:'DEVICE:platform-b:TS-20260728-002',rawScore:78,maxScore:100,completedAt:'2026-07-28T09:42:00+08:00'}),status:'SIGNED_CONFIRMED',confirmationVersions:[Object.freeze({confirmationVersionId:'SCV-PQI-HV-20260728-002-K2-01-1',versionNo:1,rawScoreReference:'DEVICE:platform-b:TS-20260728-002',finalScore:78,modificationReason:null,signatureData:'data:image/png;base64,c2FtcGxl',examinerAccount:'examiner.zhang',signedAt:'2026-07-28T01:45:00.000Z',action:'ACCEPT_RAW'})]},
        {questionInstanceId:'PQI-HV-20260728-003-K2-01',candidate:'王五',idCard:'3601**********3886',project:'高压验电器安全使用',category:'K2 安全操作技术',source:'泰豪实训平台',raw:rawScore({rawScoreReference:'DEVICE:taihao:TS-20260728-003',rawScore:92,maxScore:100,completedAt:'2026-07-28T09:48:00+08:00'}),status:'PENDING_CONFIRMATION',confirmationVersions:[]}
      ];
      function submitScoreConfirmation(input={}){
        const record=scoreRecords.find(item=>item.questionInstanceId===input.questionInstanceId);
        if(!record)return {ok:false,code:'RAW_SCORE_NOT_FOUND',message:'未找到该题目的原始成绩'};
        const examinerAccount=String(input.examinerAccount||'').trim();
        const signatureData=String(input.signatureData||'').trim();
        if(!examinerAccount)return {ok:false,code:'EXAMINER_ACCOUNT_REQUIRED',message:'当前考评员账号无效'};
        if(!signatureData.startsWith('data:image/'))return {ok:false,code:'SIGNATURE_REQUIRED',message:'请先完成手写签名'};
        const finalScore=Number(input.finalScore);
        if(!Number.isFinite(finalScore)||finalScore<0||finalScore>record.raw.maxScore)return {ok:false,code:'FINAL_SCORE_INVALID',message:`最终成绩须在 0 至 ${record.raw.maxScore} 之间`};
        const modified=finalScore!==record.raw.rawScore;
        const modificationReason=String(input.modificationReason||'').trim();
        if(modified&&!modificationReason)return {ok:false,code:'MODIFICATION_REASON_REQUIRED',message:'修改最终成绩时必须填写修改原因'};
        const history=record.confirmationVersions;
        const action=history.length?(modified?'RECONFIRM_MODIFIED':'RECONFIRM_ACCEPT_RAW'):(modified?'MODIFY_SCORE':'ACCEPT_RAW');
        const version=Object.freeze({confirmationVersionId:`SCV-${record.questionInstanceId}-${history.length+1}`,versionNo:history.length+1,rawScoreReference:record.raw.rawScoreReference,finalScore,modificationReason:modified?modificationReason:null,signatureData,examinerAccount,signedAt:new Date().toISOString(),action});
        record.confirmationVersions=[...history,version];record.status='SIGNED_CONFIRMED';
        return {ok:true,code:'SCORE_SIGNED_CONFIRMED',version,history:record.confirmationVersions};
      }
      function latestVersion(record){return record.confirmationVersions.at(-1)||null;}
      function aggregateSignedFinalScores(){return scoreRecords.flatMap(record=>{const version=latestVersion(record);return version?[{questionInstanceId:record.questionInstanceId,finalScore:version.finalScore,confirmationVersionId:version.confirmationVersionId}]:[];});}
      function runTabletRuntimeChecks(){
        const passed=[];const check=(value,label)=>{if(!value)throw new Error(`平板端运行检查失败：${label}`);passed.push(label);};
        const snapshots=scoreRecords.map(record=>({record,status:record.status,versions:[...record.confirmationVersions]}));
        try{
          const record=scoreRecords[0];record.status='PENDING_CONFIRMATION';record.confirmationVersions=[];
          check(Object.isFrozen(record.raw)&&record.raw.immutable&&record.raw.rawScore===86.5,'设备原始成绩不可变且保持来源值');
          check(!aggregateSignedFinalScores().some(item=>item.questionInstanceId===record.questionInstanceId),'待确认原始成绩不进入聚合');
          check(submitScoreConfirmation({questionInstanceId:record.questionInstanceId,finalScore:86.5,examinerAccount:'examiner.zhang'}).code==='SIGNATURE_REQUIRED','未签名不得确认');
          check(submitScoreConfirmation({questionInstanceId:record.questionInstanceId,finalScore:90,examinerAccount:'examiner.zhang',signatureData:'data:image/png;base64,c2ln'}).code==='MODIFICATION_REASON_REQUIRED','修改成绩必须填写原因');
          const accepted=submitScoreConfirmation({questionInstanceId:record.questionInstanceId,finalScore:86.5,examinerAccount:'examiner.zhang',signatureData:'data:image/png;base64,c2ln'});
          check(accepted.ok&&accepted.version.versionNo===1&&accepted.version.action==='ACCEPT_RAW','接受原始成绩生成首个签名版本');
          check(aggregateSignedFinalScores().find(item=>item.questionInstanceId===record.questionInstanceId).finalScore===86.5,'签名确认后最终成绩进入聚合');
          const modified=submitScoreConfirmation({questionInstanceId:record.questionInstanceId,finalScore:91,modificationReason:'复核现场录像后修正',examinerAccount:'examiner.li',signatureData:'data:image/png;base64,c2lnMg=='});
          check(modified.ok&&modified.version.versionNo===2&&modified.version.action==='RECONFIRM_MODIFIED'&&record.confirmationVersions.length===2,'再次确认追加版本且保留历史');
          check(record.confirmationVersions[1].modificationReason==='复核现场录像后修正'&&record.confirmationVersions.every(item=>item.rawScoreReference&&item.signatureData&&item.examinerAccount&&item.signedAt),'版本保存原因、原始分引用、签名、账号和时间');
          check(aggregateSignedFinalScores().find(item=>item.questionInstanceId===record.questionInstanceId).finalScore===91,'聚合使用最新签名版本');
          return passed;
        }finally{snapshots.forEach(item=>{item.record.status=item.status;item.record.confirmationVersions=item.versions;});}
      }
      global.__tabletScoreConfirmation={scoreRecords,submitScoreConfirmation,aggregateSignedFinalScores,runTabletRuntimeChecks};
      if(typeof document==='undefined')return;

      let activeId=scoreRecords.find(item=>item.status==='PENDING_CONFIRMATION')?.questionInstanceId||scoreRecords[0].questionInstanceId;
      let activeFilter='pending';let signatureDirty=false;let toastTimer;
      const taskList=document.getElementById('taskList');const detailPane=document.getElementById('detailPane');
      function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
      function statusLabel(record){return record.status==='SIGNED_CONFIRMED'?'已签名确认':'待考评员确认';}
      function renderStats(){const pending=scoreRecords.filter(item=>item.status==='PENDING_CONFIRMATION').length;document.getElementById('stats').innerHTML=`<div class="stat"><b>${scoreRecords.length}</b><span>全部任务</span></div><div class="stat"><b>${pending}</b><span>待确认</span></div><div class="stat"><b>${scoreRecords.length-pending}</b><span>已确认</span></div>`;}
      function filteredRecords(){return scoreRecords.filter(item=>activeFilter==='all'||(activeFilter==='pending'?item.status==='PENDING_CONFIRMATION':item.status==='SIGNED_CONFIRMED'));}
      function renderTasks(){const records=filteredRecords();taskList.innerHTML=records.map(record=>`<button class="task ${record.questionInstanceId===activeId?'active':''}" data-record-id="${record.questionInstanceId}"><div><strong>${escapeHtml(record.candidate)}</strong><div class="tag ${record.status==='SIGNED_CONFIRMED'?'confirmed':'pending'}">${statusLabel(record)}</div></div><div class="score">${record.raw.rawScore}</div><div class="project">${escapeHtml(record.project)} · ${escapeHtml(record.category)}</div></button>`).join('')||'<div class="empty">当前筛选下暂无任务</div>';global.lucide?.createIcons();}
      function historyRows(record){return [...record.confirmationVersions].reverse().map(version=>`<tr><td>V${version.versionNo}</td><td><b>${version.finalScore}</b></td><td>${escapeHtml(version.modificationReason||'接受设备原始成绩')}</td><td>${escapeHtml(version.examinerAccount)}</td><td>${new Date(version.signedAt).toLocaleString('zh-CN',{hour12:false})}</td><td>${escapeHtml(version.action)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">尚无确认版本</td></tr>';}
      function renderDetail(){
        const record=scoreRecords.find(item=>item.questionInstanceId===activeId)||scoreRecords[0];activeId=record.questionInstanceId;const latest=latestVersion(record);
        detailPane.innerHTML=`<div class="detail-head"><div><h2>${escapeHtml(record.candidate)} · ${escapeHtml(record.project)}</h2><p>${escapeHtml(record.questionInstanceId)}</p></div><span class="tag ${record.status==='SIGNED_CONFIRMED'?'confirmed':'pending'}">${statusLabel(record)}</span></div><div class="detail-body"><div class="source-band"><div><span>考生</span><b>${escapeHtml(record.candidate)} ${escapeHtml(record.idCard)}</b></div><div><span>考试项目</span><b>${escapeHtml(record.project)}</b></div><div><span>成绩来源</span><b>${escapeHtml(record.source)}</b></div><div><span>当前最终成绩</span><b>${latest?latest.finalScore:'-'}</b></div></div><h3 class="section-title">核对设备原始成绩</h3><div class="score-form"><div class="field"><label>设备原始成绩（不可修改）</label><input id="rawScoreDisplay" value="${record.raw.rawScore}" readonly></div><div class="field"><label>满分</label><input value="${record.raw.maxScore}" readonly></div><div class="field full"><label class="required">确认方式</label><div class="segment"><label><input type="radio" name="decision" value="accept" checked><span><i data-lucide="check"></i>接受原始成绩</span></label><label><input type="radio" name="decision" value="modify"><span><i data-lucide="pencil-line"></i>修改最终成绩</span></label></div></div><div class="field"><label class="required">最终成绩</label><input id="finalScore" type="number" min="0" max="${record.raw.maxScore}" step="0.5" value="${record.raw.rawScore}" readonly></div><div class="field hidden" id="reasonField"><label class="required">修改原因</label><textarea id="modificationReason" placeholder="请填写现场复核依据"></textarea></div></div><h3 class="section-title">考评员手写签名</h3><div class="signature-box"><canvas id="signatureCanvas" width="820" height="150" aria-label="手写签名画布"></canvas><div class="signature-foot"><span class="signature-state" id="signatureState">请在上方签名区域书写</span><button class="secondary" data-action="clear-signature"><i data-lucide="eraser"></i>清除签名</button></div></div><div class="form-actions"><button class="primary" data-action="submit-confirmation"><i data-lucide="badge-check"></i>签名并提交</button></div><h3 class="section-title">确认版本历史</h3><div class="history"><table><thead><tr><th>版本</th><th>最终成绩</th><th>确认说明</th><th>考评员账号</th><th>签署时间</th><th>动作</th></tr></thead><tbody>${historyRows(record)}</tbody></table></div></div>`;
        initializeCanvas();global.lucide?.createIcons();
      }
      function initializeCanvas(){const canvas=document.getElementById('signatureCanvas');const context=canvas.getContext('2d');let drawing=false;signatureDirty=false;context.strokeStyle='#173840';context.lineWidth=2.6;context.lineCap='round';context.lineJoin='round';const point=event=>{const rect=canvas.getBoundingClientRect();return {x:(event.clientX-rect.left)*canvas.width/rect.width,y:(event.clientY-rect.top)*canvas.height/rect.height};};canvas.addEventListener('pointerdown',event=>{drawing=true;canvas.setPointerCapture(event.pointerId);const p=point(event);context.beginPath();context.moveTo(p.x,p.y);});canvas.addEventListener('pointermove',event=>{if(!drawing)return;const p=point(event);context.lineTo(p.x,p.y);context.stroke();signatureDirty=true;const state=document.getElementById('signatureState');state.textContent='签名已记录';state.classList.add('signed');});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);}
      function syncDecision(){const modify=document.querySelector('input[name="decision"]:checked')?.value==='modify';const record=scoreRecords.find(item=>item.questionInstanceId===activeId);const finalInput=document.getElementById('finalScore');finalInput.readOnly=!modify;if(!modify)finalInput.value=record.raw.rawScore;document.getElementById('reasonField').classList.toggle('hidden',!modify);}
      function clearSignature(){const canvas=document.getElementById('signatureCanvas');canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);signatureDirty=false;const state=document.getElementById('signatureState');state.textContent='请在上方签名区域书写';state.classList.remove('signed');}
      function showToast(message,error=false){const toast=document.getElementById('toast');toast.textContent=message;toast.className=`toast show${error?' error':''}`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className='toast',2200);}
      function submitCurrent(){const canvas=document.getElementById('signatureCanvas');const result=submitScoreConfirmation({questionInstanceId:activeId,finalScore:Number(document.getElementById('finalScore').value),modificationReason:document.getElementById('modificationReason')?.value||'',signatureData:signatureDirty?canvas.toDataURL('image/png'):'',examinerAccount:'examiner.zhang'});if(!result.ok){showToast(result.message,true);return;}renderStats();renderTasks();renderDetail();showToast(`提交成功，已生成确认版本 V${result.version.versionNo}`);}
      document.addEventListener('click',event=>{const filter=event.target.closest('[data-filter]');if(filter){activeFilter=filter.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===filter));renderTasks();return;}const task=event.target.closest('[data-record-id]');if(task){activeId=task.dataset.recordId;renderTasks();renderDetail();return;}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='clear-signature')clearSignature();if(action==='submit-confirmation')submitCurrent();});
      document.addEventListener('change',event=>{if(event.target.name==='decision')syncDecision();});
      renderStats();renderTasks();renderDetail();global.lucide?.createIcons();
    })(globalThis);
  </script>
</body>
</html>
