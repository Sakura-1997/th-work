<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>考务人员端 · 移动端原型</title>
<style>
:root {
  --primary: #16355f;
  --primary-deep: #0e2547;
  --primary-soft: #e8eef8;
  --accent: #e8a13c;
  --accent-deep: #c77f1a;
  --accent-soft: #fdf3e1;
  --bg: #eef2f8;
  --card: #ffffff;
  --text: #22314d;
  --text-secondary: #71809c;
  --text-faint: #9aa7bd;
  --line: #e3e9f2;
  --green: #2f9e63;
  --green-soft: #e4f5ec;
  --gray: #8a94a6;
  --gray-soft: #eef0f4;
  --blue: #2f6fd0;
  --blue-soft: #e7effc;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: #dfe6ef;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
ul, ol { list-style: none; }

/* ---------- 手机外框 ---------- */
.stage { width: 100%; display: flex; justify-content: center; padding: 28px 12px; }
.phone {
  width: 393px;
  height: 852px;
  max-height: calc(100vh - 56px);
  background: var(--bg);
  border-radius: 42px;
  border: 10px solid #111a2c;
  box-shadow: 0 30px 70px rgba(14, 28, 51, 0.35);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

.app {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.role-chip {
  font-size: 11px;
  background: rgba(232, 161, 60, 0.18);
  color: #ffd9a0;
  border: 1px solid rgba(232, 161, 60, 0.55);
  padding: 2px 9px;
  border-radius: 999px;
}

.page { flex: 1; overflow-y: auto; padding: 16px 16px 24px; min-height: 0; }
.page::-webkit-scrollbar { width: 0; }

.page-title { font-size: 19px; font-weight: 700; }
.page-desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ---------- 底部导航 ---------- */
.bottom-nav {
  flex: none;
  display: flex;
  background: #fff;
  border-top: 1px solid var(--line);
  padding: 6px 4px calc(10px + env(safe-area-inset-bottom, 0px));
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 0 2px;
  color: var(--text-faint);
  font-size: 11px;
  position: relative;
  transition: color 0.15s;
}
.nav-item svg { width: 23px; height: 23px; }
.nav-item.active { color: var(--primary); font-weight: 600; }

/* ---------- 通用组件 ---------- */
.section { margin-top: 18px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.tab-badge {
  position: absolute;
  top: -5px;
  right: 6px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #e6ebf3;
  box-sizing: content-box;
}

.card {
  background: var(--card);
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(22, 53, 95, 0.06);
}
.task-card { padding: 14px 15px; margin-bottom: 10px; }
.task-card:active { background: #f6f8fc; }
.task-card .tc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.task-card .tc-title { font-size: 15px; font-weight: 700; line-height: 1.35; flex: 1; }
.status-tag { flex: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.status-tag.pending   { background: var(--accent-soft); color: var(--accent-deep); }
.status-tag.accepted  { background: var(--green-soft); color: var(--green); }
.status-tag.rejected  { background: var(--gray-soft); color: var(--gray); }
.status-tag.completed { background: var(--blue-soft); color: var(--blue); }
.task-card .tc-meta { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
.task-card .tc-meta .row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
.task-card .tc-meta .row svg { width: 14px; height: 14px; flex: none; color: var(--text-faint); }
.task-card .tc-meta .row strong { color: var(--text); font-weight: 600; }

.empty-box { padding: 26px 16px; text-align: center; color: var(--text-faint); font-size: 13px; background: var(--card); border-radius: 14px; }

.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  flex: 1;
  padding: 13px 0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { opacity: 0.85; transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-warn { background: var(--accent); color: #fff; }
.btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline-danger { background: #fff; color: #c0504d; border: 1.5px solid #d98f8d; }
.btn-plain { background: var(--gray-soft); color: var(--text-secondary); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn-block { width: 100%; }

.link-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
  background: var(--card);
  border-radius: 14px;
  margin-top: 18px;
  box-shadow: 0 2px 8px rgba(22, 53, 95, 0.06);
}
.link-card:active { background: #f6f8fc; }
.link-card .lc-left { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.link-card .lc-left svg { width: 20px; height: 20px; color: var(--primary); }
.link-card .lc-arrow { color: var(--text-faint); font-size: 18px; }

/* ---------- 筛选标签（分段控件） ---------- */
.filter-tabs {
  display: flex;
  margin-top: 2px;
  padding: 3px;
  background: #e6ebf3;
  border-radius: 10px;
}
.filter-tab {
  flex: 1;
  position: relative;
  padding: 7px 0;
  border-radius: 8px;
  font-size: 13px;
  text-align: center;
  color: var(--text-secondary);
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.filter-tab.active {
  background: var(--primary);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 1px 4px rgba(14, 37, 71, 0.25);
}
.filter-tab .ft-count { margin-left: 3px; font-size: 11px; font-weight: 400; color: var(--text-faint); }
.filter-tab.active .ft-count { color: #ffd9a0; }

/* ---------- 详情/弹层 ---------- */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 25, 43, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 60;
}
.overlay[hidden] { display: none; }
.sheet {
  width: 100%;
  max-height: 86%;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sheet-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px 12px;
  background: var(--bg);
}
.sheet-head .sh-title { font-size: 17px; font-weight: 700; }
.sheet-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #fff;
  color: var(--text-secondary);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(22, 53, 95, 0.1);
}
.sheet-body { flex: 1; overflow-y: auto; padding: 0 16px 20px; min-height: 0; }
.sheet-foot { flex: none; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); }

.info-card { background: #fff; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
.info-card .ic-title { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
.info-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13.5px; }
.info-row + .info-row { border-top: 1px dashed var(--line); }
.info-row .k { color: var(--text-secondary); flex: none; }
.info-row .v { font-weight: 600; text-align: right; word-break: break-all; }

.lock-tip {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--accent-soft);
  border: 1px dashed rgba(199, 127, 26, 0.5);
  color: var(--accent-deep);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 600;
}
.lock-tip svg { width: 18px; height: 18px; flex: none; }

.log-list { margin-top: 6px; }
.log-item { display: flex; gap: 10px; padding: 8px 0; font-size: 12.5px; }
.log-item + .log-item { border-top: 1px dashed var(--line); }
.log-item .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.log-item .log-main { flex: 1; }
.log-item .log-text { font-weight: 600; }
.log-item .log-reason { color: var(--text-secondary); margin-top: 2px; }
.log-item .log-time { flex: none; color: var(--text-faint); font-size: 11.5px; }

/* 原因选择 */
.reason-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.reason-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 14px 15px;
  font-size: 14.5px;
  font-weight: 600;
}
.reason-item .radio {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid #c4cddd;
  flex: none;
  display: flex; align-items: center; justify-content: center;
}
.reason-item.selected { border-color: var(--primary); background: var(--primary-soft); }
.reason-item.selected .radio { border-color: var(--primary); }
.reason-item.selected .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }

/* 考生名单 */
.candidate-card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.candidate-card .cc-top { display: flex; align-items: center; justify-content: space-between; }
.candidate-card .cc-name { font-size: 15px; font-weight: 700; }
.sign-tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.sign-tag.signed { background: var(--green-soft); color: var(--green); }
.sign-tag.unsigned { background: var(--gray-soft); color: var(--gray); }
.candidate-card .cc-meta { margin-top: 6px; font-size: 12.5px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 3px; }

/* ---------- 分析页 ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-card { background: #fff; border-radius: 14px; padding: 14px 15px; }
.stat-card .sc-label { font-size: 12px; color: var(--text-secondary); }
.stat-card .sc-value { font-size: 22px; font-weight: 800; color: var(--primary); margin-top: 5px; }
.stat-card .sc-value small { font-size: 12px; font-weight: 600; color: var(--text-faint); margin-left: 2px; }
.stat-card.highlight { background: linear-gradient(140deg, var(--primary), var(--primary-deep)); }
.stat-card.highlight .sc-label { color: rgba(255, 255, 255, 0.75); }
.stat-card.highlight .sc-value { color: #ffd9a0; }

.chart-card { background: #fff; border-radius: 14px; padding: 15px; margin-top: 12px; }
.chart-card .ch-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 130px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar-col .bar-val { font-size: 10px; color: var(--text-secondary); font-weight: 600; }
.bar-col .bar { width: 100%; max-width: 26px; border-radius: 5px 5px 2px 2px; background: linear-gradient(180deg, #3d6db5, var(--primary)); }
.bar-col.current .bar { background: linear-gradient(180deg, #f2b968, var(--accent)); }
.bar-col .bar-label { font-size: 10px; color: var(--text-faint); }

.record-card { background: #fff; border-radius: 14px; padding: 13px 15px; margin-bottom: 10px; }
.record-card .rc-title { font-size: 14px; font-weight: 700; line-height: 1.35; }
.record-card .rc-sub { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
.record-card .rc-stats { display: flex; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.record-card .rc-stat { flex: 1; text-align: center; }
.record-card .rc-stat + .rc-stat { border-left: 1px solid var(--line); }
.record-card .rc-stat .n { font-size: 15px; font-weight: 800; color: var(--primary); }
.record-card .rc-stat .t { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

/* ---------- 我的 ---------- */
.profile-hero { background: #fff; border-radius: 14px; padding: 18px 15px; display: flex; align-items: center; gap: 14px; margin-top: 2px; }
.avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(140deg, var(--primary), #3d6db5);
  color: #fff; font-size: 21px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex: none;
}
.profile-hero .ph-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.profile-hero .ph-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; }

/* ---------- 历史考评记录列表页 ---------- */
.back-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.back-btn {
  display: flex; align-items: center; gap: 2px;
  color: var(--primary); font-size: 14px; font-weight: 600;
  padding: 6px 12px 6px 0;
}
.back-btn svg { width: 18px; height: 18px; }
.more-btn { font-size: 12.5px; color: var(--primary); font-weight: 600; padding: 4px 0 4px 10px; }
.filter-bar { background: #fff; border-radius: 14px; padding: 12px; margin-top: 12px; }
.fb-search { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 9px 12px; }
.fb-search svg { width: 16px; height: 16px; color: var(--text-faint); flex: none; }
.fb-search input { border: none; background: none; outline: none; flex: 1; font-size: 14px; color: var(--text); font-family: inherit; min-width: 0; }
.fb-row { display: flex; gap: 8px; margin-top: 10px; }
.fb-date { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.fb-date svg { width: 16px; height: 16px; color: var(--text-faint); flex: none; }
.fb-date input { border: none; background: none; outline: none; flex: 1; font-size: 13px; color: var(--text); font-family: inherit; min-width: 0; }
.fb-reset { flex: none; padding: 0 16px; border-radius: 10px; background: var(--gray-soft); color: var(--text-secondary); font-size: 13px; font-weight: 600; }
.fb-reset:active { background: #e2e6ee; }
.result-count { font-size: 12px; color: var(--text-faint); margin: 12px 2px 10px; }

/* ---------- Toast ---------- */
.toast-wrap { position: absolute; left: 0; right: 0; bottom: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 90; pointer-events: none; }
.toast {
  background: rgba(20, 30, 50, 0.88);
  color: #fff;
  font-size: 13px;
  padding: 10px 18px;
  border-radius: 999px;
  max-width: 82%;
  animation: toast-in 0.2s ease-out;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- 窄屏：去掉外框 ---------- */
@media (max-width: 540px) {
  body { background: var(--bg); }
  .stage { padding: 0; }
  .phone {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }
}
</style>
</head>

</div>

/* ================= 状态计算 ================= */
function isBeforeExamStart(task, now) {
  return new Date(task.startAt).getTime() > now.getTime();
}

function getTodoBuckets(taskList, now) {
  return {
    upcoming: taskList.filter(t => t.status === 'accepted' && isBeforeExamStart(t, now)),
    pending: taskList.filter(t => t.status === 'pending')
  };
}

function getTaskBuckets(taskList) {
  return {
    pending: taskList.filter(t => t.status === 'pending'),
    accepted: taskList.filter(t => t.status === 'accepted'),
    rejected: taskList.filter(t => t.status === 'rejected'),
    completed: taskList.filter(t => t.status === 'completed')
  };
}

}

/* ================= 任务详情 ================= */
function findTask(taskId) {
  return tasks.find(t => t.id === taskId);
}

function openTaskDetail(taskId) {
  const task = findTask(taskId);
  if (!task) return;
  const beforeStart = isBeforeExamStart(task, demoNow);

  let candidateArea = '';
  if (task.status === 'accepted') {
    const count = task.candidates ? task.candidates.length : 0;
    candidateArea = '<div class="link-card" id="detailCandidates" role="button" style="margin-top:0">' +
      '<div class="lc-left">' + ICONS.users + '查看考生名单（' + count + ' 人）</div>' +
      '<div class="lc-arrow">&rsaquo;</div></div>';
  } else if (task.status === 'pending') {
    candidateArea = '<div class="lock-tip">' + ICONS.lock + '接受后可查看考生名单</div>';
  } else if (task.status === 'rejected') {
    candidateArea = '<div class="lock-tip">' + ICONS.lock + '任务已拒绝，不能查看考生名单</div>';
  }

  let actions = '';
  if (task.status === 'pending') {
    actions = '<div class="btn-row">' +
      '<button class="btn btn-outline-danger" id="btnReject">拒绝任务</button>' +
      '<button class="btn btn-primary" id="btnAccept">接受任务</button>' +
    '</div>';
  } else if (task.status === 'accepted' && beforeStart) {
    actions = '<div class="btn-row"><button class="btn btn-plain btn-block" id="btnCancel">撤销接受</button></div>';
  }

  openSheet(
    sheetHeadHTML('任务详情') +
    '<div class="sheet-body">' +
      infoCardHTML(task) +
      candidateArea +
      eventLogHTML(task) +
    '</div>' +
    (actions ? '<div class="sheet-foot">' + actions + '</div>' : '')
  );
  bindSheetClose();

  const btnAccept = document.getElementById('btnAccept');
  if (btnAccept) btnAccept.addEventListener('click', () => acceptTask(taskId));
  const btnReject = document.getElementById('btnReject');
  if (btnReject) btnReject.addEventListener('click', () => openRejectSheet(taskId));
  const btnCancel = document.getElementById('btnCancel');
  if (btnCancel) btnCancel.addEventListener('click', () => openCancelSheet(taskId));
  const detailCandidates = document.getElementById('detailCandidates');
  if (detailCandidates) detailCandidates.addEventListener('click', () => openCandidateList(taskId));
}

/* ================= 接受 ================= */
function logTimeNow() {
  return '09-30 14:00';
}

function acceptTask(taskId) {
  const task = findTask(taskId);
  if (!task || task.status !== 'pending') return;
  task.status = 'accepted';
  if (!task.candidates) {
    task.candidates = [
      { name: '刘志远', idMasked: '3601**********4412', subject: task.subject, signIn: 'unsigned' },
      { name: '杨秀兰', idMasked: '3601**********9907', subject: task.subject, signIn: 'unsigned' },
      { name: '黄志明', idMasked: '3603**********2255', subject: task.subject, signIn: 'unsigned' }
    ];
  }
  task.eventLog.push({ time: logTimeNow(), text: '已接受任务' });
  closeSheet();
  renderApp();
  showToast('已接受任务，考生名单已解锁');
}

/* ================= 拒绝 ================= */
let pendingReason = null;

function openRejectSheet(taskId) {
  pendingReason = null;
  openSheet(
    sheetHeadHTML('拒绝任务') +
    '<div class="sheet-body">' +
      '<div class="page-desc" style="margin-bottom:10px">请选择拒绝原因，确认后任务将进入已拒绝列表，且不能查看考生名单。</div>' +
      '<div class="reason-list">' +
        REJECT_REASONS.map(r => '<button class="reason-item" data-reason="' + r + '"><span class="radio"></span>' + r + '</button>').join('') +
      '</div>' +
    '</div>' +
    '<div class="sheet-foot"><div class="btn-row">' +
      '<button class="btn btn-plain" id="btnReasonBack">返回</button>' +
      '<button class="btn btn-warn" id="btnReasonConfirm" disabled>确认拒绝</button>' +
    '</div></div>'
  );
  bindSheetClose();

  sheetEl.querySelectorAll('.reason-item').forEach(item => {
    item.addEventListener('click', () => {
      sheetEl.querySelectorAll('.reason-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      pendingReason = item.getAttribute('data-reason');
      document.getElementById('btnReasonConfirm').disabled = false;
    });
  });
  document.getElementById('btnReasonBack').addEventListener('click', () => openTaskDetail(taskId));
  document.getElementById('btnReasonConfirm').addEventListener('click', () => confirmReject(taskId, pendingReason));
}

function confirmReject(taskId, reason) {
  const task = findTask(taskId);
  if (!task || task.status !== 'pending' || !reason) return;
  task.status = 'rejected';
  task.rejectReason = reason;
  task.eventLog.push({ time: logTimeNow(), text: '已拒绝任务', reason: reason });
  closeSheet();
  renderApp();
  showToast('已拒绝任务');
}

/* ================= 撤销接受 ================= */
function openCancelSheet(taskId) {
  const task = findTask(taskId);
  if (!task || task.status !== 'accepted' || !isBeforeExamStart(task, demoNow)) return;
  pendingReason = null;
  openSheet(
    sheetHeadHTML('撤销接受') +
    '<div class="sheet-body">' +
      '<div class="page-desc" style="margin-bottom:10px">请选择撤销原因，确认后任务将回到待响应，可重新接受；撤销记录会保留在操作记录中。</div>' +
      '<div class="reason-list">' +
        CANCEL_REASONS.map(r => '<button class="reason-item" data-reason="' + r + '"><span class="radio"></span>' + r + '</button>').join('') +
      '</div>' +
    '</div>' +
    '<div class="sheet-foot"><div class="btn-row">' +
      '<button class="btn btn-plain" id="btnReasonBack">返回</button>' +
      '<button class="btn btn-warn" id="btnReasonConfirm" disabled>确认撤销</button>' +
    '</div></div>'
  );
  bindSheetClose();

  sheetEl.querySelectorAll('.reason-item').forEach(item => {
    item.addEventListener('click', () => {
      sheetEl.querySelectorAll('.reason-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      pendingReason = item.getAttribute('data-reason');
      document.getElementById('btnReasonConfirm').disabled = false;
    });
  });
  document.getElementById('btnReasonBack').addEventListener('click', () => openTaskDetail(taskId));
  document.getElementById('btnReasonConfirm').addEventListener('click', () => confirmCancel(taskId, pendingReason));
}

function confirmCancel(taskId, reason) {
  const task = findTask(taskId);
  if (!task || task.status !== 'accepted' || !reason || !isBeforeExamStart(task, demoNow)) return;
  task.status = 'pending';
  task.cancelReason = reason;
  task.eventLog.push({ time: logTimeNow(), text: '已接受后撤销', reason: reason });
  closeSheet();
  renderApp();
  showToast('已撤销接受，任务回到待处理考试');
}

/* ================= 考生名单 ================= */
function openCandidateList(taskId) {
  const task = findTask(taskId);
  if (!task || task.status !== 'accepted' || !task.candidates) {
    showToast('接受任务后才能查看考生名单');
    return;
  }
  const listHTML = task.candidates.map(c =>
    '<div class="candidate-card">' +
      '<div class="cc-top"><span class="cc-name">' + c.name + '</span>' +
      '<span class="sign-tag ' + c.signIn + '">' + (c.signIn === 'signed' ? '已签到' : '未签到') + '</span></div>' +
      '<div class="cc-meta"><span>证件号：' + c.idMasked + '</span><span>考试科目：' + c.subject + '</span></div>' +
    '</div>'
  ).join('');

  openSheet(
    sheetHeadHTML('考生名单（' + task.candidates.length + ' 人）') +
    '<div class="sheet-body">' + listHTML + '</div>' +
    '<div class="sheet-foot"><button class="btn btn-outline btn-block" id="btnBackDetail">返回任务详情</button></div>'
  );
  bindSheetClose();
  document.getElementById('btnBackDetail').addEventListener('click', () => openTaskDetail(taskId));
}

renderApp();
</script>
</body>
</html>
